<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A GraphQL student profile for Reboot01">
    <title>GraphQL Profile</title>
    <link rel="stylesheet" href="css/style.css?v=20260808-2">
  </head>
  <body>
    <section class="login-page" id="login-view">
      <form class="login-card" id="login-form">
        <p class="eyebrow">Reboot01</p>
        <h1>Student profile</h1>
        <p class="muted">Sign in to view your learning progress.</p>

        <label for="identifier">Username or email</label>
        <input
          id="identifier"
          name="identifier"
          type="text"
          autocomplete="username"
          required
        >

        <label for="password">Password</label>
        <input
          id="password"
          name="password"
          type="password"
          autocomplete="current-password"
          required
        >

        <button id="login-button" type="submit">Sign in</button>
        <p class="error-message" id="login-error" role="alert" hidden></p>
      </form>
    </section>

    <main class="profile-page" id="profile-view" hidden>
      <header class="profile-header">
        <div>
          <p class="eyebrow">My learning journey</p>
          <h1 id="welcome-message">Welcome</h1>
          <p class="muted" id="user-id"></p>
        </div>
        <button class="secondary-button" id="logout-button" type="button">
          Log out
        </button>
      </header>

      <p class="status-message" id="profile-status" role="status"></p>

      <section class="summary-grid" aria-label="Profile summary">
        <article class="summary-card">
          <p>Total XP</p>
          <strong id="total-xp">&mdash;</strong>
        </article>
        <article class="summary-card">
          <p>Audit ratio</p>
          <strong id="audit-ratio">&mdash;</strong>
        </article>
        <article class="summary-card">
          <p>Passed projects</p>
          <strong id="passed-projects">&mdash;</strong>
        </article>
      </section>

      <section class="graphs-grid" aria-label="Statistics">
        <article class="graph-card">
          <div>
            <p class="eyebrow">Progress</p>
            <h2>XP over time</h2>
          </div>
          <svg
            id="xp-chart"
            viewBox="0 0 760 300"
            role="img"
            aria-labelledby="xp-chart-title xp-chart-description"
          ></svg>
        </article>

        <article class="graph-card">
          <div>
            <p class="eyebrow">Contribution</p>
            <h2>Audit ratio</h2>
          </div>
          <svg
            id="audit-chart"
            viewBox="0 0 420 300"
            role="img"
            aria-labelledby="audit-chart-title audit-chart-description"
          ></svg>
        </article>
      </section>
    </main>

    <script type="module" src="js/main.js?v=20260809-1"></script>
  </body>
</html>
